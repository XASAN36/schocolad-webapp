<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Schocolad</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        :root {
            --bg: var(--tg-theme-bg-color, #ffffff);
            --text: var(--tg-theme-text-color, #000000);
            --hint: var(--tg-theme-hint-color, #999999);
            --link: var(--tg-theme-link-color, #2481cc);
            --btn: var(--tg-theme-button-color, #2481cc);
            --btn-text: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #f1f1f1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding-bottom: 80px;
            min-height: 100vh;
        }

        header {
            padding: 16px;
            background: var(--secondary-bg);
            border-bottom: 1px solid var(--hint);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .search {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: none;
            background: var(--bg);
            color: var(--text);
            font-size: 15px;
            outline: none;
        }

        .categories {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .categories::-webkit-scrollbar { display: none; }

        .cat-chip {
            padding: 8px 14px;
            border-radius: 16px;
            background: var(--secondary-bg);
            color: var(--text);
            font-size: 14px;
            white-space: nowrap;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .cat-chip.active {
            background: var(--btn);
            color: var(--btn-text);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 12px 16px;
        }

        .card {
            background: var(--secondary-bg);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .card-img {
            width: 100%;
            aspect-ratio: 1;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--hint);
            font-size: 40px;
        }
        .card-img img { width: 100%; height: 100%; object-fit: cover; }

        .card-body { padding: 10px 12px; }
        .card-title {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-price {
            font-size: 15px;
            font-weight: 600;
            color: var(--btn);
        }

        .empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--hint);
        }

        .loader {
            text-align: center;
            padding: 20px;
            color: var(--hint);
        }

        /* Модалка карточки товара */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: flex-end;
            z-index: 100;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--bg);
            width: 100%;
            max-height: 90vh;
            border-radius: 16px 16px 0 0;
            overflow-y: auto;
            padding-bottom: 20px;
        }
        .modal-img {
            width: 100%;
            aspect-ratio: 1;
            background: var(--secondary-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            color: var(--hint);
        }
        .modal-img img { width: 100%; height: 100%; object-fit: cover; }
        .modal-body { padding: 16px; }
        .modal-title { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
        .modal-category { color: var(--hint); font-size: 14px; margin-bottom: 12px; }
        .modal-desc { font-size: 15px; line-height: 1.5; margin-bottom: 16px; white-space: pre-wrap; }
        .modal-price { font-size: 24px; font-weight: 700; color: var(--btn); margin-bottom: 16px; }
    </style>
</head>
<body>
    <header>
        <h1 id="shop-title">Магазин сладостей</h1>
        <input type="text" class="search" id="search" placeholder="Поиск...">
    </header>

    <div class="categories" id="categories"></div>
    <div class="grid" id="products"></div>

    <!-- Модалка товара -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-img" id="modal-img">🍬</div>
            <div class="modal-body">
                <div class="modal-title" id="modal-title"></div>
                <div class="modal-category" id="modal-category"></div>
                <div class="modal-desc" id="modal-desc"></div>
                <div class="modal-price" id="modal-price"></div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // ВАЖНО: сюда впишите URL вашего бэкенда (ngrok см. Часть 4)
        const API_BASE = "https://schocolad-backend.onrender.com";;

        const state = {
            categories: [],
            products: [],
            activeCategoryId: null,
            searchQuery: "",
        };

        const $ = (id) => document.getElementById(id);

        function formatPrice(minor) {
            const rub = Math.floor(minor / 100);
            const kop = minor % 100;
            return kop ? `${rub},${String(kop).padStart(2, "0")} ₽` : `${rub} ₽`;
        }

        async function fetchCategories() {
            const res = await fetch(`${API_BASE}/api/categories`);
            state.categories = await res.json();
            renderCategories();
        }

        async function fetchProducts() {
            $("products").innerHTML = '<div class="loader">Загрузка...</div>';
            const params = new URLSearchParams({ limit: "50" });
            if (state.activeCategoryId) params.append("category_id", state.activeCategoryId);
            if (state.searchQuery) params.append("q", state.searchQuery);

            const res = await fetch(`${API_BASE}/api/products?${params}`);
            state.products = await res.json();
            renderProducts();
        }

        function renderCategories() {
            const el = $("categories");
            el.innerHTML = "";

            const allChip = document.createElement("div");
            allChip.className = "cat-chip" + (!state.activeCategoryId ? " active" : "");
            allChip.textContent = "Все";
            allChip.onclick = () => {
                state.activeCategoryId = null;
                renderCategories();
                fetchProducts();
            };
            el.appendChild(allChip);

            for (const cat of state.categories) {
                const chip = document.createElement("div");
                chip.className = "cat-chip" + (state.activeCategoryId === cat.id ? " active" : "");
                chip.textContent = cat.title;
                chip.onclick = () => {
                    state.activeCategoryId = cat.id;
                    renderCategories();
                    fetchProducts();
                };
                el.appendChild(chip);
            }
        }

        function renderProducts() {
            const el = $("products");
            el.innerHTML = "";

            if (!state.products.length) {
                el.innerHTML = '<div class="empty">Товары не найдены</div>';
                return;
            }

            for (const p of state.products) {
                const card = document.createElement("div");
                card.className = "card";
                card.onclick = () => openProduct(p);

                const cat = state.categories.find(c => c.id === p.category_id);
                const imgHtml = p.image_url
                    ? `<img src="${p.image_url}" alt="${p.title}" loading="lazy">`
                    : "🍬";

                card.innerHTML = `
                    <div class="card-img">${imgHtml}</div>
                    <div class="card-body">
                        <div class="card-title">${p.title}</div>
                        <div class="card-price">${formatPrice(p.price)}</div>
                    </div>
                `;
                el.appendChild(card);
            }
        }

        function openProduct(p) {
            const cat = state.categories.find(c => c.id === p.category_id);
            const imgHtml = p.image_url
                ? `<img src="${p.image_url}" alt="${p.title}">`
                : "🍬";
            $("modal-img").innerHTML = imgHtml;
            $("modal-title").textContent = p.title;
            $("modal-category").textContent = cat ? cat.title : "";
            $("modal-desc").textContent = p.description || "";
            $("modal-price").textContent = formatPrice(p.price);
            $("modal").classList.add("active");
            tg?.HapticFeedback?.impactOccurred("light");
        }

        $("modal").onclick = (e) => {
            if (e.target.id === "modal") $("modal").classList.remove("active");
        };

        // Поиск с debounce
        let searchTimer;
        $("search").addEventListener("input", (e) => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => {
                state.searchQuery = e.target.value.trim();
                fetchProducts();
            }, 300);
        });

        // Старт
        (async () => {
            try {
                await fetchCategories();
                await fetchProducts();
            } catch (err) {
                $("products").innerHTML = `<div class="empty">Ошибка загрузки. Проверьте API_BASE.</div>`;
                console.error(err);
            }
        })();
    </script>
</body>
</html>
